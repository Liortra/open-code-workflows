<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Box — Catalog</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Recipe Box</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/index.html">Catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/planner.html">Meal Planner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/shopping-list.html">Shopping List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin.html">Admin</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h1 class="h3 mb-0">Recipe Catalog</h1>
      <div class="btn-group" role="group" aria-label="Filter by category" id="category-filter">
        <button type="button" class="btn btn-outline-primary active" data-category="">
          All
        </button>
      </div>
    </div>

    <div id="alert-container"></div>
    <div id="recipe-list" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3"></div>
    <p id="empty-state" class="text-muted d-none">No recipes found for this category.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/catalog.js"></script>
</body>
</html>
