<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hebrew Language Tutor — Quiz</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Hebrew Language Tutor</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/admin.html">Admin</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 640px;">
    <a id="back-link" href="/index.html" class="d-inline-block mb-3">&larr; Back to lesson</a>
    <h1 id="page-title" class="mb-3">Quiz</h1>
    <div id="status" class="text-muted"></div>

    <div id="quiz-content" class="d-none">
      <p id="progress" class="text-muted"></p>
      <div class="card">
        <div class="card-body">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span id="prompt" class="hebrew-text"></span>
            <span id="speaker-slot"></span>
          </div>
          <div id="choices" class="d-flex flex-column gap-2"></div>
          <div id="feedback" class="mt-3"></div>
          <button id="next-btn" class="btn btn-primary mt-3 d-none">Next</button>
        </div>
      </div>
    </div>

    <div id="summary" class="d-none text-center">
      <h2>Quiz complete</h2>
      <p id="summary-score" class="fs-3"></p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <button id="retake-btn" class="btn btn-success">Retake Quiz</button>
        <a id="summary-back-link" href="/index.html" class="btn btn-outline-secondary">Back to lesson</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/tts.js"></script>
  <script src="/static/js/quiz.js"></script>
</body>
</html>
