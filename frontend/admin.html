<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Box — Admin</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Recipe Box</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/planner.html">Meal Planner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/shopping-list.html">Shopping List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/admin.html">Admin</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-3">Add a Recipe</h1>
    <div id="alert-container"></div>
    <div id="success-panel" class="d-none">
      <div class="alert alert-success" id="success-message"></div>
      <div class="d-flex gap-2 mb-4">
        <a class="btn btn-primary" id="view-recipe-link" href="#">View recipe</a>
        <button type="button" class="btn btn-outline-secondary" id="add-another-btn">
          Add another recipe
        </button>
      </div>
    </div>

    <form id="recipe-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="title-input">Title</label>
        <input type="text" class="form-control" id="title-input" name="title" required />
      </div>

      <div class="mb-3">
        <label class="form-label" for="category-select">Category</label>
        <select class="form-select" id="category-select" name="category" required>
          <option value="" selected disabled>Choose a category&hellip;</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Ingredients</label>
        <div id="ingredient-rows"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="add-ingredient-btn">
          + Add ingredient
        </button>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Steps</label>
        <div id="step-rows"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="add-step-btn">
          + Add step
        </button>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Create recipe</button>
    </form>
  </main>

  <!-- Templates for repeatable rows; cloned by admin.js -->
  <template id="ingredient-row-template">
    <div class="repeatable-row">
      <input type="text" class="form-control ingredient-quantity" placeholder="Quantity (e.g. 2 cups)" />
      <input type="text" class="form-control ingredient-name" placeholder="Ingredient name (e.g. flour)" />
      <button type="button" class="btn btn-outline-danger btn-sm remove-row" aria-label="Remove ingredient">&times;</button>
    </div>
  </template>

  <template id="step-row-template">
    <div class="repeatable-row">
      <input type="text" class="form-control step-text" placeholder="Step instruction" />
      <button type="button" class="btn btn-outline-danger btn-sm remove-row" aria-label="Remove step">&times;</button>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/admin.js"></script>
</body>
</html>
