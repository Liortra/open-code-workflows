<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hebrew Language Tutor — Admin</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Hebrew Language Tutor</a>
      <div class="navbar-nav ms-auto align-items-center gap-3">
        <a class="nav-link" href="/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/srs.html">Review</a>
        <a class="nav-link" href="/admin.html">Admin</a>
        <div id="nikud-toggle-slot"></div>
      </div>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 640px;">
    <h1 class="mb-4">Admin</h1>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h4">Add Lesson</h2>
        <form id="lesson-form" class="d-flex flex-column gap-2">
          <label class="form-label" for="lesson-title">Title</label>
          <input
            type="text"
            id="lesson-title"
            class="form-control"
            required
            placeholder="e.g. Kitchen Vocabulary"
          />
          <button type="submit" class="btn btn-primary align-self-start">Add Lesson</button>
        </form>
        <div id="lesson-form-status" class="mt-2"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <h2 class="h4">Add Vocabulary</h2>
        <form id="vocab-form" class="d-flex flex-column gap-2">
          <label class="form-label" for="vocab-lesson">Lesson</label>
          <select id="vocab-lesson" class="form-select" required></select>

          <label class="form-label" for="vocab-hebrew">Hebrew word</label>
          <input type="text" id="vocab-hebrew" class="form-control hebrew-text" required />

          <label class="form-label" for="vocab-meaning">Meaning</label>
          <input type="text" id="vocab-meaning" class="form-control" required />

          <button type="submit" class="btn btn-primary align-self-start">Add Vocabulary</button>
        </form>
        <div id="vocab-form-status" class="mt-2"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nikud.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
