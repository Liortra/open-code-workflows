<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Box — Shopping List</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Recipe Box</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/planner.html">Meal Planner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/shopping-list.html">Shopping List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin.html">Admin</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 640px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Shopping List</h1>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="refresh-btn">
        Refresh
      </button>
    </div>
    <p class="text-muted">
      Aggregated from every recipe currently planned for the coming week.
    </p>
    <div id="alert-container"></div>
    <ul class="list-group" id="shopping-list"></ul>
    <p id="empty-state" class="text-muted d-none">
      Nothing is planned for the coming week, so there's nothing to buy yet.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/shopping-list.js"></script>
</body>
</html>
