<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Box — Cook Mode</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Recipe Box</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/planner.html">Meal Planner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/shopping-list.html">Shopping List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin.html">Admin</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 640px;">
    <p><a id="back-to-recipe" href="/index.html">&larr; Back to recipe</a></p>
    <div id="alert-container"></div>

    <div id="cook-mode" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h1 class="h4 mb-0" id="recipe-title"></h1>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="reset-btn">
          Reset progress
        </button>
      </div>

      <div class="card cook-step-card">
        <div class="card-body d-flex flex-column">
          <p class="text-muted mb-2 cook-step-indicator" id="step-indicator"></p>
          <p class="cook-step-text flex-grow-1" id="step-text"></p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="step-checkbox" />
            <label class="form-check-label" for="step-checkbox">Mark this step done</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between mt-3">
        <button type="button" class="btn btn-secondary" id="prev-btn">&larr; Previous</button>
        <button type="button" class="btn btn-primary" id="next-btn">Next &rarr;</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/cook.js"></script>
</body>
</html>
