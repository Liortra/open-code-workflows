<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Box — Meal Planner</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Recipe Box</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/planner.html">Meal Planner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/shopping-list.html">Shopping List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin.html">Admin</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <h1 class="h3 mb-3 px-2">Meal Planner</h1>
    <p class="text-muted px-2">
      Today through the next 6 days. Assign any recipe to any day below.
    </p>
    <div id="alert-container" class="px-2"></div>
    <div id="planner-days" class="row row-cols-1 row-cols-md-3 row-cols-xl-7 g-3 px-2"></div>
  </main>

  <!-- Template for one day column; cloned per day by planner.js -->
  <template id="day-template">
    <div class="col">
      <div class="card planner-day">
        <div class="card-header">
          <div class="fw-semibold day-weekday"></div>
          <div class="text-muted small day-date"></div>
        </div>
        <ul class="list-group list-group-flush day-entries"></ul>
        <div class="card-body">
          <form class="d-flex flex-column gap-2 assign-form">
            <select class="form-select form-select-sm recipe-select" required></select>
            <button type="submit" class="btn btn-sm btn-primary">Add to this day</button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/planner.js"></script>
</body>
</html>
