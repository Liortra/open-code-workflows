<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hebrew Language Tutor — Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Hebrew Language Tutor</a>
      <div class="navbar-nav ms-auto align-items-center gap-3">
        <a class="nav-link" href="/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/srs.html">Review</a>
        <a class="nav-link" href="/admin.html">Admin</a>
        <div id="nikud-toggle-slot"></div>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h1 class="mb-0">Dashboard</h1>
      <a href="/index.html" class="btn btn-outline-primary">Browse Lesson Catalog</a>
    </div>
    <div id="status" class="text-muted"></div>

    <div id="dashboard-content" class="d-none">
      <div class="card mb-4 streak-card">
        <div class="card-body d-flex align-items-baseline gap-2">
          <span id="streak-count" class="display-5 fw-bold"></span>
          <span id="streak-label" class="text-muted"></span>
          <span class="text-muted">streak</span>
        </div>
      </div>

      <h2 class="h4">Lesson Mastery</h2>
      <div id="lesson-mastery" class="d-flex flex-column gap-3 mb-4"></div>

      <h2 class="h4">Exam History</h2>
      <div id="exam-history"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nikud.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
