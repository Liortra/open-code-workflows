<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hebrew Language Tutor — Exam</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Hebrew Language Tutor</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/admin.html">Admin</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 720px;">
    <a id="back-link" href="/index.html" class="d-inline-block mb-3">&larr; Back to lesson</a>
    <h1 id="page-title" class="mb-1">Exam</h1>
    <p class="text-muted">
      Answer every question, then submit. No feedback is shown until you submit.
    </p>
    <div id="status" class="text-muted"></div>

    <div id="exam-content" class="d-none">
      <div id="questions" class="d-flex flex-column gap-3"></div>
      <button id="submit-btn" class="btn btn-primary mt-4" disabled>Submit Exam</button>
    </div>

    <div id="results" class="d-none">
      <h2 id="results-score" class="mb-3"></h2>
      <div id="review" class="d-flex flex-column gap-2"></div>
      <div class="d-flex gap-2 mt-4">
        <button id="retake-btn" class="btn btn-success">Retake Exam</button>
        <a id="results-back-link" href="/index.html" class="btn btn-outline-secondary">Back to lesson</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/tts.js"></script>
  <script src="/static/js/exam.js"></script>
</body>
</html>
